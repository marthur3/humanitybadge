<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Humanity Badge - Typing Replay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Humanity Badge - Verified Human Typing">
  <meta property="og:description" content="Authentic human typing verified with Humanity Badge">
  <meta property="og:type" content="website">
  <style>
    :root {
      --blue-600: #1a73e8;
      --blue-50: #e8f0fe;
      --green-600: #1e8e3e;
      --green-50: #e6f4ea;
      --red-600: #d93025;
      --red-50: #fce8e6;
      --grey-50: #f8f9fa;
      --grey-200: #e8eaed;
      --grey-300: #dadce0;
      --grey-500: #9aa0a6;
      --grey-700: #5f6368;
      --grey-900: #202124;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Google Sans', 'Segoe UI', Roboto, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      background: var(--grey-50);
    }

    .replay-container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(60,64,67,0.3), 0 4px 8px rgba(60,64,67,0.15);
      overflow: hidden;
    }

    .replay-header {
      background: var(--blue-600);
      color: white;
      padding: 24px;
      text-align: center;
    }

    .replay-header h1 {
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: 400;
    }

    .replay-info {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 13px;
      opacity: 0.9;
      flex-wrap: wrap;
    }

    .verification-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 12px;
    }

    .verification-badge.verified {
      background: rgba(255,255,255,0.2);
      color: white;
    }

    .verification-badge.failed {
      background: rgba(217,48,37,0.3);
      color: white;
    }

    .replay-controls {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--grey-200);
      flex-wrap: wrap;
    }

    .replay-controls button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      background: var(--blue-600);
      color: white;
      font-family: inherit;
      transition: background 0.15s;
    }

    .replay-controls button:hover:not(:disabled) { background: #1765cc; }
    .replay-controls button:disabled { background: var(--grey-300); cursor: not-allowed; }

    .speed-controls {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--grey-700);
    }

    .speed-controls select {
      padding: 6px 8px;
      border: 1px solid var(--grey-300);
      border-radius: 4px;
      font-family: inherit;
    }

    .progress-container { padding: 0 20px 16px; }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--grey-200);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    #progress-fill {
      height: 100%;
      background: var(--blue-600);
      width: 0%;
      transition: width 0.1s linear;
      border-radius: 3px;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--grey-500);
    }

    .replay-area { padding: 20px; background: var(--grey-50); }
    .textarea-container { position: relative; }

    #replay-textarea {
      width: 100%;
      min-height: 200px;
      padding: 16px;
      border: 1px solid var(--grey-300);
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
      background: white;
      color: var(--grey-900);
    }

    #cursor {
      position: absolute;
      width: 2px;
      height: 20px;
      background: var(--blue-600);
      animation: blink 1s infinite;
      pointer-events: none;
      display: none;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .replay-stats {
      padding: 16px 20px;
      display: flex;
      justify-content: space-around;
      background: white;
      border-top: 1px solid var(--grey-200);
      flex-wrap: wrap;
      gap: 12px;
    }

    .stat { text-align: center; }
    .stat label {
      display: block;
      font-size: 11px;
      color: var(--grey-500);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .stat span {
      font-size: 20px;
      font-weight: 500;
      color: var(--grey-900);
    }

    .replay-footer {
      padding: 20px;
      background: var(--grey-50);
      border-top: 1px solid var(--grey-200);
      text-align: center;
    }

    .footer-info {
      font-size: 13px;
      color: var(--grey-700);
      margin-bottom: 12px;
    }

    .get-extension-btn {
      display: inline-block;
      padding: 10px 24px;
      background: var(--blue-600);
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 500;
      font-size: 14px;
      transition: background 0.15s;
    }

    .get-extension-btn:hover { background: #1765cc; }

    .error {
      text-align: center;
      padding: 40px;
      color: var(--red-600);
      background: var(--red-50);
      margin: 20px;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .replay-controls { flex-direction: column; align-items: stretch; }
      .speed-controls { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="replay-container">
    <header class="replay-header">
      <h1>Humanity Badge - Verified Typing</h1>
      <div class="replay-info">
        <span id="site-info"></span>
        <span id="duration-info"></span>
      </div>
      <div id="verification-badge" class="verification-badge"></div>
    </header>

    <div class="replay-controls">
      <button id="play-btn">Play</button>
      <button id="pause-btn" disabled>Pause</button>
      <button id="reset-btn">Reset</button>
      <div class="speed-controls">
        <label>Speed:</label>
        <select id="speed-select">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="4">4x</option>
          <option value="8">8x</option>
        </select>
      </div>
    </div>

    <div class="progress-container">
      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>
      <div class="time-info">
        <span id="current-time">0s</span> / <span id="total-time">0s</span>
      </div>
    </div>

    <div class="replay-area">
      <div class="textarea-container">
        <textarea id="replay-textarea" readonly></textarea>
        <div id="cursor"></div>
      </div>
    </div>

    <div class="replay-stats">
      <div class="stat">
        <label>Characters</label>
        <span id="char-count">0</span>
      </div>
      <div class="stat">
        <label>Words</label>
        <span id="word-count">0</span>
      </div>
      <div class="stat">
        <label>WPM</label>
        <span id="wpm">0</span>
      </div>
    </div>

    <footer class="replay-footer">
      <div class="footer-info">
        Verified with Humanity Badge - proving human authenticity
      </div>
      <a href="https://github.com/humanitybadge/extension" class="get-extension-btn" target="_blank">
        Get Humanity Badge
      </a>
    </footer>
  </div>

  <script id="recording-data" type="application/json">
    {{RECORDING_DATA}}
  </script>

  <script>
    class StandaloneReplayPlayer {
      constructor() {
        this.recording = null;
        this.currentEventIndex = 0;
        this.isPlaying = false;
        this.isPaused = false;
        this.startTime = null;
        this.pausedTime = 0;
        this.speed = 1;

        this.textarea = document.getElementById('replay-textarea');
        this.cursor = document.getElementById('cursor');
        this.progressFill = document.getElementById('progress-fill');

        this.init();
      }

      init() {
        try {
          const dataScript = document.getElementById('recording-data');
          if (!dataScript || !dataScript.textContent.trim()) {
            this.showError('No recording data found');
            return;
          }

          this.recording = JSON.parse(dataScript.textContent);
          this.setupReplay();
          this.setupControls();
        } catch (error) {
          this.showError('Failed to load recording: ' + error.message);
        }
      }

      setupReplay() {
        this.textarea.value = this.recording.initialValue || '';
        this.textarea.placeholder = this.recording.placeholder || '';

        document.getElementById('site-info').textContent = `From: ${this.recording.domain || 'Unknown'}`;
        document.getElementById('duration-info').textContent = `Duration: ${Math.round(this.recording.duration / 1000)}s`;
        document.getElementById('total-time').textContent = Math.round(this.recording.duration / 1000) + 's';

        const verification = this.recording.verification || {};
        const badge = document.getElementById('verification-badge');

        if (verification.isAuthentic) {
          badge.className = 'verification-badge verified';
          badge.textContent = `Verified Human - ${verification.wpm} WPM`;
        } else {
          badge.className = 'verification-badge failed';
          badge.textContent = verification.reason || 'Verification Failed';
        }

        this.updateStats();
      }

      setupControls() {
        document.getElementById('play-btn').addEventListener('click', () => this.play());
        document.getElementById('pause-btn').addEventListener('click', () => this.pause());
        document.getElementById('reset-btn').addEventListener('click', () => this.reset());
        document.getElementById('speed-select').addEventListener('change', (e) => {
          this.speed = parseFloat(e.target.value);
        });
      }

      play() {
        if (!this.recording) return;
        this.isPlaying = true;
        this.isPaused = false;
        this.startTime = Date.now() - this.pausedTime;
        document.getElementById('play-btn').disabled = true;
        document.getElementById('pause-btn').disabled = false;
        this.cursor.style.display = 'block';
        this.playLoop();
      }

      pause() {
        this.isPaused = true;
        this.isPlaying = false;
        this.pausedTime = Date.now() - this.startTime;
        document.getElementById('play-btn').disabled = false;
        document.getElementById('pause-btn').disabled = true;
        this.cursor.style.display = 'none';
      }

      reset() {
        this.isPlaying = false;
        this.isPaused = false;
        this.currentEventIndex = 0;
        this.pausedTime = 0;
        this.startTime = null;
        this.textarea.value = this.recording.initialValue || '';
        this.cursor.style.display = 'none';
        this.progressFill.style.width = '0%';
        document.getElementById('play-btn').disabled = false;
        document.getElementById('pause-btn').disabled = true;
        document.getElementById('current-time').textContent = '0s';
        this.updateStats();
      }

      playLoop() {
        if (!this.isPlaying || this.isPaused) return;

        const elapsed = (Date.now() - this.startTime) * this.speed;
        const events = this.recording.events || [];

        while (this.currentEventIndex < events.length &&
               events[this.currentEventIndex].timestamp <= elapsed) {
          this.processEvent(events[this.currentEventIndex]);
          this.currentEventIndex++;
        }

        const progress = Math.min(elapsed / this.recording.duration * 100, 100);
        this.progressFill.style.width = progress + '%';
        document.getElementById('current-time').textContent = Math.round(elapsed / 1000) + 's';

        this.updateCursorPosition();
        this.updateStats();

        if (this.currentEventIndex >= events.length) {
          this.isPlaying = false;
          document.getElementById('play-btn').disabled = false;
          document.getElementById('pause-btn').disabled = true;
          this.cursor.style.display = 'none';
          return;
        }

        requestAnimationFrame(() => this.playLoop());
      }

      processEvent(event) {
        if (event.type === 'input') {
          this.textarea.value = event.value || '';
          if (typeof event.selectionStart === 'number') {
            this.textarea.selectionStart = event.selectionStart;
            this.textarea.selectionEnd = event.selectionEnd;
          }
        }
      }

      updateCursorPosition() {
        const cursorPos = this.textarea.selectionStart || 0;
        const textBeforeCursor = this.textarea.value.substring(0, cursorPos);
        const lines = textBeforeCursor.split('\n').length;
        this.cursor.style.left = '15px';
        this.cursor.style.top = (15 + (lines - 1) * 20) + 'px';
      }

      updateStats() {
        const text = this.textarea.value;
        const charCount = text.length;
        const wordCount = text.trim().split(/\s+/).filter(word => word.length > 0).length;

        let wpm = 0;
        if (this.isPlaying && this.startTime) {
          const elapsedMinutes = ((Date.now() - this.startTime) * this.speed) / 60000;
          wpm = Math.round(wordCount / Math.max(elapsedMinutes, 0.1));
        } else if (this.recording.verification && this.recording.verification.wpm) {
          wpm = this.recording.verification.wpm;
        }

        document.getElementById('char-count').textContent = charCount;
        document.getElementById('word-count').textContent = wordCount;
        document.getElementById('wpm').textContent = wpm;
      }

      showError(message) {
        document.querySelector('.replay-container').innerHTML = `
          <div class="error">
            <h2>Error</h2>
            <p>${message}</p>
          </div>
        `;
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => new StandaloneReplayPlayer());
    } else {
      new StandaloneReplayPlayer();
    }
  </script>
</body>
</html>
